<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya — Links</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red:    #FF3D57;
    --blue:   #0A66C2;
    --yellow: #FFD600;
    --gh:     #e6edf3;
  }

  html, body {
    height: 100%;
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
  }

  .page {
    width: 100%;
    max-width: 380px;
    padding: 48px 24px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Avatar ring */
  .avatar-wrap {
    position: relative;
    width: 80px;
    height: 80px;
    margin-bottom: 20px;
  }

  .avatar-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(var(--red), var(--yellow), var(--blue), var(--red));
    animation: spin 4s linear infinite;
    z-index: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar-inner {
    position: relative;
    z-index: 1;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #111;
    border: 3px solid #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
  }

  /* Name */
  .name {
    font-family: 'Syne', sans-serif;
    font-size: 30px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .name em { font-style: normal; color: var(--yellow); }

  .handle {
    margin-top: 6px;
    font-size: 11px;
    color: #444;
    letter-spacing: 0.15em;
    margin-bottom: 36px;
  }

  /* Link buttons */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    border-radius: 14px;
    text-decoration: none;
    border: 1px solid transparent;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
    overflow: hidden;
  }

  .link-btn:active { transform: scale(0.98); }

  .link-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .link-btn:hover::before { opacity: 1; }

  /* Portfolio */
  .link-btn.portfolio {
    background: rgba(255,61,87,0.08);
    border-color: rgba(255,61,87,0.2);
  }
  .link-btn.portfolio:hover {
    box-shadow: 0 0 0 1px var(--red), 0 8px 32px rgba(255,61,87,0.2);
    transform: translateY(-2px);
  }
  .link-btn.portfolio .icon { color: var(--red); }
  .link-btn.portfolio .label { color: #fff; }
  .link-btn.portfolio .sub { color: rgba(255,61,87,0.6); }

  /* LinkedIn */
  .link-btn.linkedin {
    background: rgba(10,102,194,0.08);
    border-color: rgba(10,102,194,0.2);
  }
  .link-btn.linkedin:hover {
    box-shadow: 0 0 0 1px var(--blue), 0 8px 32px rgba(10,102,194,0.2);
    transform: translateY(-2px);
  }
  .link-btn.linkedin .icon { color: var(--blue); }
  .link-btn.linkedin .label { color: #fff; }
  .link-btn.linkedin .sub { color: rgba(10,102,194,0.6); }

  /* GitHub */
  .link-btn.github {
    background: rgba(230,237,243,0.04);
    border-color: rgba(230,237,243,0.08);
  }
  .link-btn.github:hover {
    box-shadow: 0 0 0 1px #444, 0 8px 32px rgba(255,255,255,0.05);
    transform: translateY(-2px);
  }
  .link-btn.github .icon { color: var(--gh); }
  .link-btn.github .label { color: #fff; }
  .link-btn.github .sub { color: #444; }

  .icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg { width: 22px; height: 22px; fill: currentColor; }

  .text { flex: 1; }

  .label {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .sub {
    font-size: 10px;
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  .arrow {
    font-size: 16px;
    opacity: 0.3;
    color: #fff;
  }

  /* Footer */
  .footer {
    margin-top: 40px;
    font-size: 9px;
    color: #222;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
