<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Mishra — Links</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: #f4f1ea;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #111111;
    padding: 48px 24px;
  }

  .page {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid #d9d4cc;
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }

  .name {
    font-family: 'Lora', Georgia, serif;
    font-size: 32px;
    font-weight: 800;
    color: #111111;
    letter-spacing: -0.02em;
    line-height: 1;
    text-align: center;
  }

  .handle {
    margin-top: 8px;
    font-size: 13px;
    color: #4f4945;
    letter-spacing: 0.08em;
    margin-bottom: 40px;
    text-align: center;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-radius: 16px;
    text-decoration: none;
    background: #ffffff;
    border: 1px solid #d9d4cc;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }

  .link-btn:hover {
    border-color: #111111;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(17, 17, 17, 0.08);
  }

  .link-btn:active {
    transform: scale(0.98);
  }

  .icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4a4542;
  }

  .icon svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .text { flex: 1; }

  .label {
    font-size: 15px;
    font-weight: 600;
    color: #111111;
    letter-spacing: -0.01em;
  }

  .sub {
    font-size: 12px;
    color: #4f4945;
    margin-top: 2px;
    letter-spacing: 0;
  }

  .arrow {
    font-size: 16px;
    color: #4a4542;
    opacity: 0.5;
  }

  .footer {
    margin-top: 40px;
    font-size: 11px;
    color: #a09b95;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
</style>
</head>
