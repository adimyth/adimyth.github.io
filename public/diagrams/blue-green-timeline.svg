<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" role="img" aria-labelledby="bg-timeline-title">
  <title id="bg-timeline-title">Where the downtime actually falls in an RDS blue/green upgrade</title>
  <defs>
    <style>
      .down { fill: #d9d4cc; stroke: #a39b90; stroke-width: 1.25; }
      .up { fill: #f9f7f3; stroke: #d9d4cc; stroke-width: 1.25; }
      .rowlabel { fill: #111111; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; text-anchor: end; dominant-baseline: middle; }
      .tag { fill: #4a4542; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; dominant-baseline: middle; }
      .tagoff { fill: #8a8178; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; dominant-baseline: middle; }
      .note { fill: #4f4945; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 10px; dominant-baseline: middle; }
    </style>
  </defs>

  <text class="rowlabel" x="152" y="43">Parameters on blue</text>
  <rect class="down" x="162" y="30" width="75" height="26" rx="5"/>
  <text class="tag" x="247" y="43">DOWNTIME</text>

  <text class="rowlabel" x="152" y="87">Green creation and sync</text>
  <rect class="up" x="162" y="74" width="300" height="26" rx="5"/>
  <text class="note" x="172" y="87">writes blocked, our choice, not required</text>
  <text class="tagoff" x="472" y="87">reads only</text>

  <text class="rowlabel" x="152" y="131">Switchover</text>
  <rect class="down" x="162" y="118" width="15" height="26" rx="4"/>
  <text class="tag" x="187" y="131">DOWNTIME</text>
  <text class="note" x="258" y="131">typically under a minute</text>

  <text class="rowlabel" x="152" y="175">Parameters on green</text>
  <rect class="down" x="162" y="162" width="75" height="26" rx="5"/>
  <text class="tag" x="247" y="175">DOWNTIME</text>

  <line x1="162" y1="200" x2="462" y2="200" stroke="#c4bbb0" stroke-width="1"/>
  <text class="note" x="162" y="212">Bars are to scale. The switchover is the cheapest window, not the costliest.</text>
</svg>
