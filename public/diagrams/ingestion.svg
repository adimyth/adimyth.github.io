<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460" role="img" aria-labelledby="ingestion-title">
  <title id="ingestion-title">Webhook ingestion path</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6460"/>
    </marker>
    <style>
      .box { fill: #f4f1ea; stroke: #a39b90; stroke-width: 1.25; }
      .store { fill: #f4f1ea; stroke: #a39b90; stroke-width: 1.25; }
      .chip { fill: #f9f7f3; stroke: #d9d4cc; }
      .label { fill: #111111; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .sub { fill: #4f4945; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
      .edge { fill: #4a4542; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #6b6460; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #6b6460; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="170" y="12" width="220" height="34" rx="8"/>
  <text class="label" x="280" y="29">Meta / WhatsApp</text>

  <line class="line" x1="280" y1="46" x2="280" y2="68"/>
  <rect class="chip" x="318" y="48" width="86" height="18" rx="4"/>
  <text class="edge" x="361" y="57">POST webhook</text>

  <rect class="box" x="160" y="70" width="240" height="42" rx="8"/>
  <text class="label" x="280" y="86">API Gateway</text>
  <text class="sub" x="280" y="102">one per tenant</text>

  <line class="line" x1="280" y1="112" x2="280" y2="134"/>

  <rect class="box" x="150" y="136" width="260" height="42" rx="8"/>
  <text class="label" x="280" y="152">Lambda</text>
  <text class="sub" x="280" y="168">verify HMAC signature</text>

  <path class="line" d="M150 157 H72 V190"/>
  <text class="edge" x="100" y="148">invalid</text>
  <rect class="box" x="40" y="192" width="64" height="30" rx="8"/>
  <text class="label" x="72" y="207">401</text>

  <line class="line" x1="280" y1="178" x2="280" y2="204"/>
  <rect class="chip" x="288" y="184" width="40" height="18" rx="4"/>
  <text class="edge" x="308" y="193">valid</text>

  <rect class="store" x="220" y="206" width="120" height="36" rx="10"/>
  <text class="label" x="280" y="224">SQS</text>

  <path class="dashed" d="M340 224 H470 V252"/>
  <text class="edge" x="420" y="216">3 failed attempts</text>
  <rect class="store" x="438" y="254" width="64" height="30" rx="10"/>
  <text class="label" x="470" y="269">DLQ</text>

  <line class="line" x1="280" y1="242" x2="280" y2="270"/>

  <rect class="box" x="170" y="272" width="220" height="42" rx="8"/>
  <text class="label" x="280" y="288">Poller</text>
  <text class="sub" x="280" y="304">on worker box</text>

  <line class="line" x1="280" y1="314" x2="280" y2="336"/>

  <rect class="box" x="135" y="338" width="290" height="42" rx="8"/>
  <text class="label" x="280" y="354">Webhook handlers</text>
  <text class="sub" x="280" y="370">dedupe, encrypt, persist</text>

  <line class="line" x1="280" y1="380" x2="280" y2="402"/>

  <rect class="store" x="200" y="404" width="160" height="36" rx="10"/>
  <text class="label" x="280" y="422">Postgres</text>
</svg>
