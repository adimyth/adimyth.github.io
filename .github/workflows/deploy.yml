name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify no drafts were exported
        run: |
          set -uo pipefail
          fail=0
          for f in content/essays/*.mdx; do
            grep -qE '^draft:[[:space:]]*true' "$f" || continue
            slug=$(basename "$f" .mdx)
            title=$(grep -m1 '^title:' "$f" | sed 's/^title:[[:space:]]*//; s/^"//; s/"$//')
            if grep -rqF "$slug" out/ || grep -rqF "$title" out/; then
              echo "::error file=$f::Draft '$slug' leaked into the deploy output"
              fail=1
            else
              echo "ok: draft '$slug' excluded"
            fi
          done
          exit $fail

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
